[global]
# Запрещаем права на запись для всех (world-writable)
forbidden_perms=002
# Разрешенные владельцы (через запятую)
allowed_owner=root,nikit
# Разрешенные группы (через запятую)
allowed_group=root,nikit
# Максимальный размер файла в байтах (1 МБ)
max_size=1048576
# Запрет символических ссылок, ведущих за пределы root
forbid_symlinks_outside=yes
# Запрет setuid и setgid битов
forbid_setuid=yes
# Разрешенные расширения (через запятую, пустое = любые)
allowed_extensions=.txt,.sh,.conf